services:
  hejotrade:
    build:
      context: ./hejotrade
      dockerfile: Dockerfile

    container_name: hejotrade-web

    restart: unless-stopped

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"

    ports:
      - "3000:3000"
