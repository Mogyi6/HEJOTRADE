services:
  hejotrade:
    build:
      context: "https://github.com/Mogyi6/HEJOTRADE.git#main:hejotrade"
      dockerfile: Dockerfile

    container_name: hejotrade-web

    restart: unless-stopped

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"

    ports:
      - "3000:3000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3000/ || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
